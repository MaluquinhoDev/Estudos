<!doctype html>
<html lang="pt-BR" data-identity-pending=""><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1420">

<title>Estudos — Ambiente de Aprendizagem</title><link rel="icon" href="./icons/icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"><script src="./app.js" defer></script><script type="module" src="./powersync.js"></script>
</head><body>
<div class="layout"><aside class="sidebar"><a class="brand" href="#inicio"><b>E</b> Estudos</a><p class="nav-caption">AMBIENTE DE APRENDIZAGEM</p>
<nav aria-label="Navegação"><button class="nav active" data-view="inicio">⌂ <span>Visão geral</span></button><button class="nav" data-view="cursos">▤ <span>Meus cursos</span></button><button class="nav" data-view="revisoes">↻ <span>Revisões</span><em id="review-count">0</em></button><button class="nav" data-view="biblioteca">▧ <span>Biblioteca</span></button><button class="nav" data-view="progresso">◷ <span>Meu progresso</span></button></nav>
<div class="side-bottom"><div class="connection"><i id="connection-dot"></i><span><strong id="connection-status">Conectando</strong><small>Dados salvos neste navegador</small></span></div><div id="sync-panel" class="sync-panel" aria-live="polite"></div><button class="nav utility" data-action="export">⇩ <span>Baixar backup</span></button><button class="nav utility" data-action="import">⇧ <span>Restaurar backup</span></button></div></aside>
<main><header class="topbar"><div><small>SEU ESPAÇO DE ESTUDO</small><strong id="page-context">Visão geral</strong></div><div><span id="today-label"></span><button class="primary" data-action="new-course">＋ Novo curso</button></div></header>
<section id="app-content" class="content" aria-live="polite"></section><footer>Estudos · Ambiente Virtual de Aprendizagem pessoal <span id="app-version">v2.0.0</span></footer></main></div>
<dialog id="sync-dialog" class="sync-dialog"><form method="dialog" class="close-form"><button aria-label="Fechar">×</button></form><div class="sync-auth-content"><small class="eyebrow">CONTA E SINCRONIZAÇÃO</small><h2>Sincronize seus estudos</h2><p>Entre com sua conta para acessar seus dados em outros dispositivos.</p><form id="sync-auth-form" class="dialog-form"><input type="hidden" name="mode" value="signin"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><label>Senha<input name="password" type="password" autocomplete="current-password" minlength="8" required></label><div class="sync-auth-actions"><button type="button" class="secondary" id="sync-signup">Criar conta</button><button type="button" class="secondary" id="sync-signin">Já tenho conta</button><button type="submit" class="primary" id="sync-submit">Entrar</button></div></form><p id="sync-message" role="status" aria-live="polite"></p></div></dialog><dialog id="app-dialog"><form method="dialog" class="close-form"><button aria-label="Fechar">×</button></form><div id="dialog-content"></div></dialog><input id="import-file" type="file" accept=".json,application/json" hidden><div id="toast" role="status" aria-live="polite"></div>
</body></html>
