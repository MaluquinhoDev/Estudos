name: Supabase - Validate and deploy database migrations

on:
  # Deploy automatically after changes reach main.
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  # Keep manual execution available for controlled reruns.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required configuration
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure the required secrets using docs/GUIA-ATIVACAO-SUPABASE.md."
            exit 1
          fi

      - name: Check migration files
        shell: bash
        run: |
          test -f supabase/config.toml || { echo "::error::supabase/config.toml is missing"; exit 1; }
          if ! find supabase/migrations -maxdepth 1 -type f -name '*.sql' | grep -q .; then
            echo "::error::No SQL migration files found."
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.2.0

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview remote migrations
        run: supabase db push --dry-run --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Apply reviewed migrations
        run: supabase db push --yes --remote --password "$SUPABASE_DB_PASSWORD"
