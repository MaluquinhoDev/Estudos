name: Supabase - Validate migration files

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migration-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate migration structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Supabase configuration
        shell: bash
        run: |
          test -f supabase/config.toml || { echo "::error::supabase/config.toml is missing"; exit 1; }
          grep -Fq 'project_id = "bkhrxosiumviprnhlbim"' supabase/config.toml || {
            echo "::error::Unexpected Supabase project_id"
            exit 1
          }

      - name: Validate migration filenames and contents
        shell: bash
        run: |
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No SQL migrations found."
            exit 1
          fi

          declare -A timestamps=()
          for file in "${files[@]}"; do
            name="${file##*/}"
            if [[ ! "$name" =~ ^[0-9]{14}_[a-z0-9_]+\.sql$ ]]; then
              echo "::error file=$file::Migration filename must use YYYYMMDDHHMMSS_description.sql"
              exit 1
            fi
            stamp="${name:0:14}"
            if [[ -n "${timestamps[$stamp]:-}" ]]; then
              echo "::error file=$file::Duplicate migration timestamp: $stamp"
              exit 1
            fi
            timestamps[$stamp]=1
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Migration file is empty"
              exit 1
            fi
          done

          printf 'Validated %s migration file(s).\n' "${#files[@]}"

      - name: Explain deployment ownership
        run: |
          echo "This workflow validates repository files only."
          echo "Production migrations are deployed by the Supabase GitHub Integration after it is configured and enabled."
          echo "No database credentials are used and no remote database changes are made here."
