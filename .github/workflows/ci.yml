name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-main
  cancel-in-progress: true
jobs:
  validate:
    name: Validate Estudos AVA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Check required files
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f service-worker.js
          test -f manifest.webmanifest
          test -f icons/icon.svg
          test -f docs/AVA-ARQUITETURA.md
          test -f docs/PROXIMAS-ETAPAS-ARQUITETURAIS.md
          test -f docs/EXECUCAO-FASE-0.md
          test -f docs/PESQUISA-FRONTEND-E-MOTOR-PEDAGOGICO.md
      - name: Validate architecture roadmap
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const roadmap = fs.readFileSync('docs/PROXIMAS-ETAPAS-ARQUITETURAIS.md', 'utf8');
          const phaseZero = fs.readFileSync('docs/EXECUCAO-FASE-0.md', 'utf8');
          for (const token of [
            'Etapa 0',
            'Etapa 1',
            'Etapa 2',
            'Etapa 3',
            'Etapa 4',
            'Etapa 5',
            'Etapa 6',
            'CRUD queue',
            'localStorage',
            'RLS'
          ]) {
            if (!roadmap.includes(token)) throw new Error('Architecture roadmap is missing: ' + token);
          }
          for (const token of ['Fase 0A', 'Fase 0B', 'A→logout→B', 'CRUD queue', 'pgTAP']) {
            if (!phaseZero.includes(token)) throw new Error('Phase 0 execution plan is missing: ' + token);
          }
          NODE
      - name: Validate pedagogical research specification
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const research = fs.readFileSync('docs/PESQUISA-FRONTEND-E-MOTOR-PEDAGOGICO.md', 'utf8');
          const roadmap = fs.readFileSync('docs/PROXIMAS-ETAPAS-ARQUITETURAIS.md', 'utf8');
          for (const token of [
            'Auditoria do frontend atual',
            'Ferramentas para construir conhecimento',
            'Ferramentas para avaliar conhecimento',
            'learning_objectives',
            'attempts',
            'mastery_records',
            'prefers-reduced-motion',
            'H5P',
            'Status:** pesquisa e especificação documentadas'
          ]) {
            if (!research.includes(token)) throw new Error('Pedagogical specification is missing: ' + token);
          }
          if (!roadmap.includes('PESQUISA-FRONTEND-E-MOTOR-PEDAGOGICO.md')) {
            throw new Error('Architecture roadmap must link the pedagogical research');
          }
          NODE
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node --check vite.config.js
          node --check src/powersync-ui.js
          node --check src/powersync/schema.js
          node --check src/powersync/identity.js
          node --check src/powersync/connector.js
          node --check src/powersync/snapshot.js
          node --check tests/powersync-connector.test.js
      - name: Validate manifest
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if (!m.name || !m.start_url || !m.icons?.length) process.exit(1)"
      - name: Validate AVA structure
        run: node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const j=fs.readFileSync('app.js','utf8'); for(const id of ['app-content','app-dialog','import-file','review-count']) if(!h.includes('id=\"'+id+'\"')) throw Error(id); for(const fn of ['dashboard','coursesPage','coursePage','reviews','library','progress','exportData','importData']) if(!j.includes('function '+fn)) throw Error(fn)"
      - name: Validate generated dialog form styling
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const js = fs.readFileSync('app.js', 'utf8');
          const css = fs.readFileSync('styles.css', 'utf8');
          if (!js.includes('class="dialog-form"')) {
            throw new Error('Generated dialog form is missing dialog-form class');
          }
          for (const token of [
            '.dialog-form{display:grid',
            '.dialog-form label{display:grid',
            '.dialog-form textarea{resize:vertical',
            '#dialog-content > h2{'
          ]) {
            if (!css.includes(token)) throw new Error(`Missing dialog styling: ${token}`);
          }
          NODE
      - name: Validate delegated click routing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const js = fs.readFileSync('app.js', 'utf8');
          const handlerStart = js.indexOf('document.addEventListener("click"');
          const handlerEnd = js.indexOf('$("#import-file")', handlerStart);
          const handler = js.slice(handlerStart, handlerEnd);
          if (handlerStart < 0 || handlerEnd < 0) throw new Error('Delegated click handler not found');
          if (!handler.includes('button[data-course]:not([data-action])')) {
            throw new Error('Course navigation must ignore buttons that also declare data-action');
          }
          if (!handler.includes('e.target.closest("[data-action]")')) {
            throw new Error('Delegated action dispatch is missing');
          }
          NODE
      - name: Validate mobile authoring and module association
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const js = fs.readFileSync('app.js', 'utf8');
          const css = fs.readFileSync('styles.css', 'utf8');
          const start = js.indexOf('function newLesson(cid,mid,lid)');
          const end = js.indexOf('\\nfunction newCard', start);
          const lesson = js.slice(start, end);
          if (!lesson.includes('name:"moduleId"') || !lesson.includes('required:true')) {
            throw new Error('New content without a module context must require explicit module selection');
          }
          if (!lesson.includes('c.modules.find(x=>x.id===(mid||v.moduleId))')) {
            throw new Error('New content must be saved to the selected module');
          }
          if (lesson.includes('||c.modules[0]')) {
            throw new Error('New content must not silently fall back to the first module');
          }
          if (!js.includes('find(el=>!String(el.value||"").trim())')) {
            throw new Error('Required fields must reject whitespace-only values');
          }
          for (const token of ['font-size:16px', 'min-height:48px', ':focus-visible', 'max-height:min(88dvh,720px)']) {
            if (!css.includes(token)) throw new Error('Missing mobile form safeguard: ' + token);
          }
          NODE
      - name: Validate responsive layout safeguards
        run: |
          node -e 'const fs=require("fs"); const c=fs.readFileSync("styles.css","utf8"); for(const token of ["grid-template-columns: repeat(4, minmax(0, 1fr))","grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr)","@media (max-width: 820px)","@media (max-width: 420px)","overflow-y: auto","min-width: 0"]) if(!c.includes(token)) throw Error("Missing responsive safeguard: "+token)'

      - name: Validate account workspace isolation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const app = fs.readFileSync('app.js', 'utf8');
          const ui = fs.readFileSync('src/powersync-ui.js', 'utf8');
          const identity = fs.readFileSync('src/powersync/identity.js', 'utf8');
          const tests = fs.readFileSync('tests/powersync-identity.test.js', 'utf8');
          for (const [name, source, token] of [
            ['HTML bootstrap gate', html, 'data-identity-pending'],
            ['App identity bridge', app, 'clearSnapshot'],
            ['App identity readiness', app, 'setIdentityReady'],
            ['App bridge readiness signal', app, 'estudos:app-ready'],
            ['Persisted workspace clearing', app, 'localStorage.setItem(KEY,JSON.stringify(data))'],
            ['PowerSync bridge gate', ui, 'waitForAppBridge'],
            ['PowerSync account namespace', ui, 'readUserWorkspace'],
            ['PowerSync stale-session guard', ui, 'sessionGeneration'],
            ['Identity storage helper', identity, 'estudos-ava-v2:user:'],
            ['Identity regression tests', tests, 'unowned legacy data']
          ]) {
            if (!source.includes(token)) throw new Error(name + ' is missing required isolation behavior: ' + token);
          }
          NODE
      - name: Validate PowerSync configuration and ownership boundaries
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sync = fs.readFileSync('powersync/sync-config.yaml', 'utf8');
          const connector = fs.readFileSync('src/powersync/connector.js', 'utf8');
          const migration = fs.readFileSync('supabase/migrations/20261117000100_grant_authenticated_data_api.sql', 'utf8');
          const tables = ['profiles','courses','modules','lessons','review_cards','resources'];
          for (const table of tables) {
            if (!sync.includes('FROM ' + table)) throw new Error('Missing PowerSync stream table: ' + table);
            if (!migration.toLowerCase().includes('public.' + table)) {
              throw new Error('Missing authenticated Data API grant for: ' + table);
            }
          }
          if (!sync.includes('auth.user_id()')) throw new Error('Sync streams must scope data to auth.user_id()');
          if (!connector.includes('WRITABLE_TABLES') || !connector.includes('.eq("user_id", user.id)')) {
            throw new Error('Supabase uploads must whitelist tables and constrain mutations to the signed-in user');
          }
          if (!connector.includes('onConflict: "id,user_id"')) {
            throw new Error('Supabase uploads must target the actual composite primary key (id,user_id)');
          }
          if (!fs.existsSync('supabase/diagnostics/ava_schema_preflight.sql')) {
            throw new Error('Read-only AVA schema preflight SQL is missing');
          }
          if (!fs.existsSync('supabase/diagnostics/ava_schema_audit.sql')) {
            throw new Error('Read-only detailed AVA schema audit SQL is missing');
          }
          const audit = fs.readFileSync('supabase/diagnostics/ava_schema_audit.sql', 'utf8');
          const preflight = fs.readFileSync('supabase/diagnostics/ava_schema_preflight.sql', 'utf8');
          if (!audit.includes('WITH ORDINALITY') || !audit.includes('pg_get_constraintdef')) {
            throw new Error('Foreign-key audit must pair composite columns by ordinal position');
          }
          if (!audit.includes('has_table_privilege') || !audit.includes("'GRANT'::text")) {
            throw new Error('Schema audit must inspect effective anon/authenticated table privileges');
          }
          if (!preflight.includes("ARRAY['id','user_id']::text[]")) {
            throw new Error('Preflight must validate the composite tenant primary keys');
          }
          if (!connector.includes('.select("id")') || !connector.includes('result.data.length !== 1')) {
            throw new Error('PATCH uploads must verify that exactly one owned row was updated before acknowledging the CRUD transaction');
          }
          if (connector.includes('service_role') || connector.includes('SUPABASE_DB_PASSWORD')) {
            throw new Error('Privileged database credentials must never be present in the browser connector');
          }
          if (!migration.toLowerCase().includes('to authenticated')) throw new Error('Authenticated Data API grants are missing');
          NODE
      - name: Run unit tests
        run: npm test
      - name: Build PowerSync browser bundle
        run: |
          npm run build
          test -s dist/powersync.js
