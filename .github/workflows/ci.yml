name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check required files
        run: |
          test -f index.html
          test -f app.js
          test -f styles.css
          test -f service-worker.js
          test -f manifest.webmanifest
          test -f icons/icon.svg

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js

      - name: Validate web manifest
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.webmanifest','utf8')); if (!m.name || !m.start_url || !m.icons?.length) process.exit(1); console.log('Manifest válido:', m.name)"
